<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8941A"/>
      <stop offset="100%" stop-color="#D17A0E"/>
    </linearGradient>
  </defs>
  <!-- Cercle extérieur orange -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <!-- Anneau blanc intérieur -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="white" stroke-width="2"/>
  <!-- Lettre N -->
  <text x="22" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">N</text>
  <!-- Lettre C superposée -->
  <text x="40" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">C</text>
</svg>
